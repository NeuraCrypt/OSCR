<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="pipeline-t pipeline-d">
<title id="pipeline-t">How OSCR works</title>
<desc id="pipeline-d">Diagram. For every open-access paper, four steps from left to right. 1, Read: Europe PMC, the full text as JATS XML, or the metadata alone. 2, Find: the paper's availability statements, author-signed references and supplementary files; Crossref and DataCite; GitHub READMEs citing the DOI and Hugging Face. A link found is at the evidence level 'found'. 3, Judge: each link is the authors' code, data, or a third-party tool, with readable reasons. 4, Verify at the source: git ls-remote and a partial clone, the Zenodo, OSF, figshare and Dryad APIs, Software Heritage; the scripts' text, README and license are kept, never data; levels 'alive' and 'inventoried'. Everything goes to a private SQLite database on the Mac. From it, two public outputs: the catalogue (CC0), published every night at 04:17 to Hugging Face and oscr-2lj.pages.dev, with no article text and script text only under a permissive license; and the tracing map, which gets a Zenodo DOI only after one of the paper's authors validates it with ORCID.</desc>
<style>
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #e6edf3; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.canvas { fill: #161b22; stroke: #30363d; }
.card { fill: #0d1117; stroke: #30363d; }
.ink2 { fill: #9198a1; }
.ink3 { fill: #848d97; }
.bar { fill: #2d333b; }
.bar2 { fill: #3d444d; }
.arrow { stroke: #6e7681; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.arrowhead { fill: #6e7681; }
.p1 { fill: #3987e5; } .p1s { fill: rgba(57,135,229,0.22); } .p1l { stroke: #3987e5; fill: none; }
.p2 { fill: #d95926; } .p2s { fill: rgba(217,89,38,0.24); } .p2l { stroke: #d95926; fill: none; }
.p3 { fill: #199e70; } .p3s { fill: rgba(25,158,112,0.24); } .p3l { stroke: #199e70; fill: none; }
.ok { fill: #3fb950; } .okl { stroke: #3fb950; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.brand { fill: #24485f; }
.brand-ink { fill: #ffffff; }
.brand-ink2 { fill: #b6c8d4; }
.accent { fill: #3987e5; }
.accent-soft { fill: #15304f; }
.title { font-size: 16px; font-weight: 600; }
.step { font-size: 12px; font-weight: 700; fill: #0d1117; }
.h { font-size: 15px; font-weight: 600; }
.b { font-size: 12.5px; fill: #9198a1; }
.chip { font-size: 11.5px; font-weight: 600; }
.chip-on { fill: #0d1117; }
.out-h { font-size: 14px; font-weight: 600; }
.band { fill: #15304f; }
.lvl1 { fill: #184f95; } .lvl2 { fill: #256abf; } .lvl3 { fill: #3987e5; }
</style>
<rect class="canvas" x="0.5" y="0.5" width="959" height="489" rx="14"/>
<text class="title" x="24" y="36">For every open-access paper</text>
<text class="b" x="936" y="36" text-anchor="end">evidence levels in color</text>
<rect class="card" x="24" y="54" width="207" height="212" rx="10"/>
<circle class="accent" cx="48" cy="80" r="11"/>
<text class="step" x="48" y="84.5" text-anchor="middle">1</text>
<text class="h" x="66" y="85">Read</text>
<text class="b" x="40" y="114">Europe PMC: open-access</text>
<text class="b" x="40" y="132">neuroscience papers,</text>
<text class="b" x="40" y="150">full text as JATS XML;</text>
<text class="b" x="40" y="168">metadata alone when</text>
<text class="b" x="40" y="186">there is no full text.</text>
<path class="arrow" d="M236 160.0 H248"/>
<path class="arrowhead" d="M250 160.0 l-6 -4.5 v9 z"/>
<rect class="card" x="255" y="54" width="207" height="212" rx="10"/>
<circle class="accent" cx="279" cy="80" r="11"/>
<text class="step" x="279" y="84.5" text-anchor="middle">2</text>
<text class="h" x="297" y="85">Find</text>
<text class="b" x="271" y="114">The paper's text:</text>
<text class="b" x="271" y="132">availability statements,</text>
<text class="b" x="271" y="150">author-signed references,</text>
<text class="b" x="271" y="168">supplementary files.</text>
<text class="b" x="271" y="186">Metadata: Crossref, DataCite.</text>
<text class="b" x="271" y="204">Forges: GitHub READMEs</text>
<text class="b" x="271" y="222">citing the DOI, Hugging Face.</text>
<rect class="lvl1" x="271" y="232" width="48" height="22" rx="11"/>
<text class="chip" x="280" y="247">found</text>
<path class="arrow" d="M467 160.0 H479"/>
<path class="arrowhead" d="M481 160.0 l-6 -4.5 v9 z"/>
<rect class="card" x="486" y="54" width="207" height="212" rx="10"/>
<circle class="accent" cx="510" cy="80" r="11"/>
<text class="step" x="510" y="84.5" text-anchor="middle">3</text>
<text class="h" x="528" y="85">Judge</text>
<text class="b" x="502" y="114">Each link is the authors'</text>
<text class="b" x="502" y="132">code, data, or a</text>
<text class="b" x="502" y="150">third-party tool.</text>
<text class="b" x="502" y="168">Every clue is kept as a</text>
<text class="b" x="502" y="186">readable reason.</text>
<path class="arrow" d="M698 160.0 H710"/>
<path class="arrowhead" d="M712 160.0 l-6 -4.5 v9 z"/>
<rect class="card" x="717" y="54" width="207" height="212" rx="10"/>
<circle class="accent" cx="741" cy="80" r="11"/>
<text class="step" x="741" y="84.5" text-anchor="middle">4</text>
<text class="h" x="759" y="85">Verify</text>
<text class="b" x="733" y="114">At the source: git</text>
<text class="b" x="733" y="132">ls-remote and a partial</text>
<text class="b" x="733" y="150">clone; Zenodo, OSF,</text>
<text class="b" x="733" y="168">figshare, Dryad APIs;</text>
<text class="b" x="733" y="186">Software Heritage. Keeps</text>
<text class="b" x="733" y="204">the scripts' text, README</text>
<text class="b" x="733" y="222">and license, never data.</text>
<rect class="lvl2" x="733" y="232" width="45" height="22" rx="11"/>
<text class="chip" x="742" y="247">alive</text>
<rect class="lvl3" x="783.5742" y="232" width="79" height="22" rx="11"/>
<text class="chip chip-on" x="792.5742" y="247">inventoried</text>
<path class="arrow" d="M480 270 V288"/>
<path class="arrowhead" d="M480 292 l-4.5 -6 h9 z"/>
<rect class="card" x="24" y="294" width="912" height="48" rx="10"/>
<text class="out-h" x="44" y="323">Private database</text>
<text class="b" x="176" y="323">SQLite on the Mac: every paper, link, verdict and script text, including the sentences behind each verdict</text>
<path class="arrow" d="M246 346 V364"/>
<path class="arrowhead" d="M246 368 l-4.5 -6 h9 z"/>
<path class="arrow" d="M714 346 V364"/>
<path class="arrowhead" d="M714 368 l-4.5 -6 h9 z"/>
<rect class="card" x="24" y="370" width="444" height="100" rx="10"/>
<text class="out-h" x="44" y="396">Public catalogue · CC0</text>
<text class="b" x="44" y="418">Every night at 04:17: Hugging Face dataset and</text>
<text class="b" x="44" y="436">oscr-2lj.pages.dev. No article text, no PDF; a script's</text>
<text class="b" x="44" y="454">text only when its license allows it.</text>
<rect class="card" x="492" y="370" width="444" height="100" rx="10"/>
<text class="out-h" x="512" y="396">Tracing map · Zenodo DOI</text>
<text class="b" x="512" y="418">Paper → repositories, commit, license, files,</text>
<text class="b" x="512" y="436">alignments. A DOI only after one of the paper's</text>
<text class="b" x="512" y="454">authors validates the map with ORCID.</text>
</svg>
