.p1 { fill: #3987e5; } .p1s { fill: rgba(57,135,229,0.22); } .p1l { stroke: #3987e5; fill: none; }
.p2 { fill: #d95926; } .p2s { fill: rgba(217,89,38,0.24); } .p2l { stroke: #d95926; fill: none; }
