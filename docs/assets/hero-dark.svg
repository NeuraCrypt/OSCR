<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="hero-t hero-d">
<title id="hero-t">OSCR: Open Scientific Code Registry</title>
<desc id="hero-d">Banner. On the left, the name OSCR, Open Scientific Code Registry, and the tagline: the code neuroscience authors publish with their papers, found, verified at the source, and read side by side with the paper. On the right, a schematic paper and a schematic script: two highlighted paragraphs of the paper are joined to the matching highlighted lines of the script, and a badge says the code was verified at the source.</desc>
