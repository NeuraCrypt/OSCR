[project]
name = "scrapper"
version = "0.1.0"
description = "Ramasseur du code natif des articles de neurosciences : trouver où le code d'un article est référencé, le vérifier, l'importer, en faire un tableau."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # La publication sur Hugging Face fait partie du fonctionnement normal : en
    # « extra », le premier `uv run` sans lui la désinstallait de .venv.
    "huggingface_hub>=0.25",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
scrapper = "scrapper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
