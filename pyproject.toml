[project]
name = "oscr"
version = "0.2.0"
description = "Open Scientific Code Registry: find, verify and index the code published by the authors of neuroscience papers, and align it with the papers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "The OSCR contributors" }]
keywords = ["neuroscience", "research software", "reproducibility", "open science", "code availability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.28.1",
    # Publishing to Hugging Face is part of normal operation: as an "extra", the first
    # `uv run` without it uninstalled it from .venv.
    "huggingface_hub>=2.0.0",
    # The scripts' Parquet blocks (oscr/scriptstore.py): zstd page compression.
    "pyarrow>=25.0.1",
]

[project.urls]
Homepage = "https://oscr.yannbellec-b.workers.dev"
Repository = "https://github.com/NeuraCrypt/OSCR"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[project.scripts]
oscr = "oscr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oscr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B008", "B905"]
