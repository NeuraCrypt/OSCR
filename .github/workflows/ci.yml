# Continuous integration: lint and test the harvester, and build the website.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Harvester (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Lint
        run: uv run ruff check oscr tests

      - name: Test
        run: uv run pytest -q

  # The website is built from a tiny public catalogue kept in the repository, never from
  # the harvester's data: tests/fixtures/public-catalog/ holds what `oscr nightly` writes
  # to data/public/ (in public mode), for a few invented papers (tools/make_fixture.py):
  #   catalog.json        with "public": true;
  #   scripts/NN.json     the script lots named by the catalogue's repositories;
  #   alignments/NN.json  optional, the Code ↔ Paper pairs;
  #   entities/*.json     authors, journals, institutions, tools, datasets, categories;
  #   lookup/NNN.json     the DOI lookup's shards;
  #   papers/NN.json      the sections of each paper's page (overview, code, data, map,
  #                       versions, citations, similar papers).
  # Without it, the job says so and skips the build instead of failing.
  website:
    name: Website (Astro build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATALOG_DIR: ${{ github.workspace }}/tests/fixtures/public-catalog
    steps:
      - uses: actions/checkout@v4

      - name: Look for the website and its fixture catalogue
        id: fixture
        run: |
          if [ -f website/package-lock.json ] && [ -f "$CATALOG_DIR/catalog.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website build skipped::no fixture catalogue at tests/fixtures/public-catalog/catalog.json (described in .github/workflows/ci.yml)"
          fi

      - uses: actions/setup-node@v4
        if: steps.fixture.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        if: steps.fixture.outputs.ready == 'true'
        working-directory: website
        run: npm ci

      # The Worker's code: the search (the query language, the SQL it builds, its answers and
      # its errors, on SQLite databases made from migrations/d1/) and the accounts
      # (website/worker/account/). node:test with Node's own TypeScript support and
      # node:sqlite, no dependency.
      - name: Test the Worker
        if: steps.fixture.outputs.ready == 'true'
        working-directory: website
        run: npm test

      - name: Build from the fixture catalogue
        if: steps.fixture.outputs.ready == 'true'
        working-directory: website
        run: npm run build

      # Every kind of page exists (the fixture exercises them all), every internal link
      # leads to a file or a record, no page shows an email address; prints the number of
      # files folder by folder and holds the build to its file budget (src/lib/shards.ts).
      - name: Check the routes and the links
        if: steps.fixture.outputs.ready == 'true'
        working-directory: website
        run: npm run check -- --every-route

      # The file budget does not grow with the catalogue: the fixture with only its 2 most recent
      # papers static (the others rendered on demand from their records, worker/pages.ts), then the
      # same grown with tens of thousands of synthetic entities, papers and DOIs; both builds pass
      # the check, and only the shards differ, within their fixed numbers (scripts/growth.mjs).
      - name: Check that the number of files does not grow with the catalogue
        if: steps.fixture.outputs.ready == 'true'
        working-directory: website
        run: npm run check:growth
