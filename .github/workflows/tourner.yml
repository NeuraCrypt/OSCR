# EN SOMMEIL : le ramasseur tourne sur le Mac (veille continue, publication de
# nuit ; voir docs/DEMARRAGE.md). Ce passage ne part donc plus tout seul : il ne
# se lance qu'à la main (onglet Actions → « Passage quotidien » → Run workflow).
# Pour le réveiller : décommenter `schedule`, et retirer bibliotheque/ et
# /scripts/ du .gitignore.
#
# Le passage quotidien du ramasseur sur GitHub Actions, sans aucun coût pour un
# dépôt public.
#
#   la base SQLite  : gardée entre deux passages comme fichier de la release
#                     « etat » (pas dans l'historique git, qu'elle gonflerait),
#                     dans sa version SANS extraits de texte ;
#   la bibliothèque : les fiches JSON de bibliotheque/ sont commitées — c'est le
#                     motif « git scraping », chaque passage laisse un diff lisible ;
#   les scripts     : le TEXTE des scripts dont la licence permet la republication
#                     est recopié dans scripts/<dépôt>/, avec sa licence et un
#                     SOURCE.json (origine, commit), et commité aussi ;
#   Hugging Face    : si le secret HF_TOKEN et la variable HF_DATASET existent, les
#                     tables et les scripts partent aussi sur un jeu de données ;
#   le tableau      : site/ est publié sur GitHub Pages (Réglages → Pages →
#                     Source : GitHub Actions, à activer une fois).
#
# Les commits quotidiens gardent le dépôt « actif » : GitHub désactive une
# tâche planifiée après 60 jours sans activité.
name: Passage quotidien

on:
  # schedule:
  #   - cron: "17 4 * * *"      # une minute non ronde : les heures pleines sont retardées
  workflow_dispatch:
    inputs:
      domaine:
        description: "neuro, electrophysiologie, ou une requête Europe PMC"
        default: "neuro"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: passage
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Reprendre la base du passage précédent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p donnees
          gh release download etat -p bibliotheque.db -D donnees --clobber \
            || echo "Première exécution : base neuve."

      - name: Passage
        env:
          # Le jeton du workflow ouvre l'API GitHub (1 000 requêtes/h) : étoiles et
          # date de création des dépôts, pour reconnaître un outil public.
          GITHUB_TOKEN: ${{ github.token }}
          # Facultatif : une adresse de contact pour le « pool poli » de Crossref.
          SCRAPPER_CONTACT: ${{ vars.SCRAPPER_CONTACT }}
        run: uv run scrapper --public --miroir scripts tourner --domaine "${{ inputs.domaine || 'neuro' }}"

      # Le stock (614 336 articles neuro en accès libre au 26/09/2026) se prend
      # par tranches : chaque passage remonte le passé mois par mois pendant
      # RATTRAPAGE_HEURES (1,5 h par défaut), puis rend la main ; le suivant
      # reprend où il s'est arrêté. 0 pour ne pas rattraper.
      - name: Rattrapage du stock
        if: (vars.RATTRAPAGE_HEURES || '1.5') != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRAPPER_CONTACT: ${{ vars.SCRAPPER_CONTACT }}
        run: uv run scrapper --public --miroir scripts rattraper --domaine "${{ inputs.domaine || 'neuro' }}" --heures "${{ vars.RATTRAPAGE_HEURES || '1.5' }}"

      # Une Release d'un dépôt public est PUBLIQUE : on y garde la copie de la
      # base SANS les phrases des articles (site/bibliotheque_publique.db), jamais
      # la base de travail.
      - name: Garder la base pour le prochain passage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view etat >/dev/null 2>&1 \
            || gh release create etat --title "État du ramasseur" --notes "Base SQLite du dernier passage, sans extraits de texte."
          cp site/bibliotheque_publique.db "$RUNNER_TEMP/bibliotheque.db"
          gh release upload etat "$RUNNER_TEMP/bibliotheque.db" --clobber

      - name: Verser la bibliothèque
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliotheque scripts
          git diff --cached --quiet || git commit -m "Passage du $(date -u +%F)"
          git push

      - name: Publier sur Hugging Face
        if: env.HF_TOKEN != '' && vars.HF_DATASET != ''
        run: uv run scrapper --public --miroir scripts publier-hf "${{ vars.HF_DATASET }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: passage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
