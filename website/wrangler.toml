# Cloudflare Workers, free plan: the static site is the Worker's assets, served first, free and
# unlimited. Deploy with `npm run deploy`, after `npx wrangler login` (once, in the owner's
# browser). Pages is no longer used (owner's decision D9, 2026-09-26).
name = "oscr"
compatibility_date = "2026-09-01"
workers_dev = true
# The public address (bought 2026-09-29 at Cloudflare Registrar): a custom domain, kept by every deploy.
# www.openscicode.org is redirected to it by a Redirect Rule of the zone (dashboard).
routes = [{ pattern = "openscicode.org", custom_domain = true }]
# The Worker's own code: /api/search (Phase 3, docs/SEARCH.md), the accounts and the contributions
# (docs/ACCOUNTS.md, docs/CONTRIBUTIONS.md), the public keyless read API /api/v1/* (docs/API_PUBLIC.md),
# the data rights /api/rights, and the GitHub side's /api/forge/* with its token API /api/forge/v1/*
# (night phases 01 and 10, docs/FORGE.md, docs/API.md; moved off /api/v1 so it never collides with the
# keyless read API). The forge's database, oscr_forge (FORGE), is bound by tools/setup_cloudflare.sh once
# the owner has created it; until then /api/forge/* answers 503 not_configured.
# Its switch FORGE_OPEN is never set here (closed until the owner opens the GitHub side).
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# /api/* runs the Worker's code first; every other request is a static asset when a file
# answers it, free. A request that no file answers runs the Worker (`not_found_handling =
# "none"`), which renders a paper's page past STATIC_PAPERS from its record, or serves 404.html
# (worker/pages.ts): each counts against the free plan's 100,000 requests a day. When that quota
# is spent, those answer an error and the static pages stay up.
#
# The owner's switch to spend no request at all on pages (docs/PLATFORM_PLAN.md §6): set
# `not_found_handling = "404-page"`. The assets then serve the nearest 404.html themselves -
# dist/paper/404.html for a missing /paper/…, whose script renders the paper in the browser -
# but with the status 404, which search engines do not index.
not_found_handling = "none"
run_worker_first = ["/api/*"]

# Workers Caching (`[cache] enabled = true`) stays OFF: with it, every request served from the
# cache, static assets included, is billed as a Worker request (developers.cloudflare.com,
# Workers pricing, note 4). The search sets Cache-Control and uses the Cache API instead.

# The databases of the search (docs/SEARCH.md) and of the accounts (docs/ACCOUNTS.md),
# created by tools/setup_cloudflare.sh. Their ids are identifiers, not secrets.

[[d1_databases]]
binding = "CATALOG"
database_name = "oscr_catalog"
database_id = "9142b26d-faeb-429b-885d-113dc1ba5388"
migrations_dir = "../migrations/d1/catalog"

[[d1_databases]]
binding = "SEARCH"
database_name = "oscr_search"
database_id = "11992a04-6e3a-4d54-be33-7fe167e45e4e"
migrations_dir = "../migrations/d1/search"

[[d1_databases]]
binding = "COMMUNITY"
database_name = "oscr_community"
database_id = "38da2a3a-ecc2-4c7b-a4ee-2b3cb57c7b32"
migrations_dir = "../migrations/d1-community"

# Local development only, never deployed: `npx wrangler dev --env local`, `oscr d1 push --local`.
# The databases live in .wrangler/state; their ids name the local files, nothing remote.
[env.local]
name = "oscr-local"

[[env.local.d1_databases]]
binding = "CATALOG"
database_name = "oscr_catalog"
database_id = "00000000-0000-4000-8000-00000000ca7a"
migrations_dir = "../migrations/d1/catalog"

[[env.local.d1_databases]]
binding = "SEARCH"
database_name = "oscr_search"
database_id = "00000000-0000-4000-8000-000000005ea7"
migrations_dir = "../migrations/d1/search"

[[env.local.d1_databases]]
binding = "COMMUNITY"
database_name = "oscr_community"
database_id = "00000000-0000-4000-8000-00000000c0de"
migrations_dir = "../migrations/d1-community"

[[env.local.d1_databases]]
binding = "FORGE"
database_name = "oscr_forge"
database_id = "00000000-0000-4000-8000-00000000f09e"
migrations_dir = "../migrations/d1-forge"
