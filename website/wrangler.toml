# Cloudflare Workers, free plan: the static site served as the Worker's assets (no server
# code yet; asset requests are free and unlimited). Deploy with `npm run deploy`, after
# `npx wrangler login` (once, in the owner's browser). Pages is no longer used (owner's
# decision D9, 2026-09-26).
name = "oscr"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
